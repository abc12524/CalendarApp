name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - name: Rename APK with build metadata
        id: rename
        run: |
          mkdir -p release-assets
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d-%H%M%S)
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          DEST="release-assets/CalendarApp-debug-${DATE}-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=build-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarApp-debug
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: Debug Build ${{ steps.rename.outputs.date }}
          body: |
            自动构建的 Debug APK。

            - Commit: `${{ github.sha }}`
            - 触发: `${{ github.event_name }}`
            - 分支: `${{ github.ref_name }}`
          prerelease: true
          files: ${{ steps.rename.outputs.apk_path }}
