name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=${{ github.ref_name }}
          # 非 tag 推送时 versionName 用默认值
          if [ "${{ github.ref_type }}" != "tag" ]; then
            ./gradlew assembleDebug -PversionCode=$VERSION_CODE
          else
            ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName=${VERSION_NAME#v}
          fi

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: CalendarApp ${{ github.ref_name }}
          body: |
            CalendarApp ${{ github.ref_name }} 发布
            
            **versionCode:** ${{ github.run_number }}
            **versionName:** ${{ github.ref_name }}
            
            ---
          files: |
            *.apk
          generate_release_notes: true
